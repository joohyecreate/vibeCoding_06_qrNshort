<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단축 링크 이동 중...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #F8FAFC;
      color: #1F2937;
    }
    .box {
      background: #FFFFFF;
      padding: 32px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 480px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E2E8F0;
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .target-url {
      font-size: 0.9rem;
      color: #6B7280;
      word-break: break-all;
      margin: 12px 0 20px;
    }
    a.btn {
      display: inline-block;
      padding: 10px 20px;
      background: #F59E0B;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>원래 페이지로 이동 중...</h2>
    <p class="target-url" id="targetDisplay">잠시만 기다려주세요.</p>
    <a href="#" class="btn" id="manualBtn">즉시 이동하기</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const target = params.get('url');
    const targetDisplay = document.getElementById('targetDisplay');
    const manualBtn = document.getElementById('manualBtn');

    if (target) {
      try {
        const decoded = decodeURIComponent(target);
        targetDisplay.textContent = decoded;
        manualBtn.href = decoded;
        // 즉시 리다이렉트
        window.location.replace(decoded);
      } catch (e) {
        targetDisplay.textContent = target;
        manualBtn.href = target;
        window.location.replace(target);
      }
    } else {
      targetDisplay.textContent = '지정된 대상 URL이 없습니다.';
      manualBtn.style.display = 'none';
    }
  </script>
</body>
</html>
